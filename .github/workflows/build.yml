name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the .jar
        shell: bash
        run: |
          set -o pipefail
          if gradle build --no-daemon 2>&1 | tee build.log; then exit 0; fi
          # Report the important error lines as annotations (readable through the API)
          grep -nE "error:|What went wrong|Exception|Could not|> |warning: \[|Caused by|^\S+\.java:[0-9]+" build.log \
            | grep -vE "^\s*$" | head -150 > errors.txt || true
          [ -s errors.txt ] || tail -80 build.log > errors.txt
          split -l 25 errors.txt part_
          for f in part_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors ($f)::$msg"
          done
          exit 1

      - name: Test the mod in a real server
        shell: bash
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nspawn-protection=0\n" > run/server.properties
          mkfifo cmds
          (sleep 100000 > cmds &)
          gradle runServer --no-daemon < cmds > server.log 2>&1 &
          exec 3> cmds
          ok=0
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log; then ok=1; break; fi
            if ! pgrep -f runServer > /dev/null && ! pgrep java > /dev/null; then break; fi
            sleep 5
          done
          if [ $ok = 1 ]; then
            echo "execute in phantom:ghost_zone run forceload add 0 0 64 64" >&3
            sleep 4
            echo "phantom testportal" >&3
            sleep 3
            echo "phantom testrooms" >&3
            sleep 8
            echo "phantom testprison" >&3
            sleep 8
            echo "execute in phantom:ghost_zone run summon phantom:hostile_ghost 0 120 0" >&3
            echo "execute in phantom:ghost_zone run summon phantom:friendly_ghost 2 120 0" >&3
            echo "execute in phantom:ghost_zone run summon phantom:ghost_jailer 4 120 0" >&3
            echo "execute in phantom:ghost_zone run summon phantom:hover_glider 6 120 0" >&3
            echo "phantom testcrate" >&3
            echo "phantom teststage" >&3
            echo "phantom breakout" >&3
            echo "phantom testbosses" >&3
            echo "phantom testpalace" >&3
            echo "phantom testthermos" >&3
            echo "phantom testnet" >&3
            echo "phantom testfrost" >&3
            echo "phantom testhost" >&3
            echo "execute in phantom:ghost_zone run summon phantom:voltage 24 120 24 {Health:90f}" >&3
            echo "execute in phantom:ghost_zone run summon phantom:room_ghost 10 120 10" >&3
            echo "execute in phantom:ghost_zone run summon phantom:wishkeeper 14 120 14" >&3
            echo "execute in phantom:ghost_zone run summon phantom:crate_king 20 120 20 {Health:120f}" >&3
            sleep 5
            sleep 30
            echo "stop" >&3
            sleep 20
          fi
          pkill -f java || true
          grep -nE "ERROR|Exception|Caused by|at com\.phantompowers|Mixin|mixin|phantom" server.log \
            | grep -vE "^\s*$" | grep -v "No data fixer registered" | head -120 > problems.txt || true
          grep -q "Portal test: OK" server.log || { echo "Portal test did not pass" >> problems.txt; grep -n "Portal test" server.log >> problems.txt; ok=0; }
          grep -q "Prison test: OK" server.log || { echo "Prison test did not pass" >> problems.txt; grep -n -A3 "Prison test\|testprison" server.log >> problems.txt; ok=0; }
          grep -q "Summoned new Hover Glider" server.log || { echo "Glider summon failed" >> problems.txt; ok=0; }
          grep -q "Crate test: OK" server.log || { echo "Crate test failed" >> problems.txt; grep -n -A3 "testcrate\|Crate test" server.log >> problems.txt; ok=0; }
          grep -q "Stage test: OK" server.log || { echo "Stage test failed" >> problems.txt; grep -n -A3 "teststage\|Stage test" server.log >> problems.txt; ok=0; }
          grep -q "Breakout test: OK" server.log || { echo "Breakout test failed" >> problems.txt; grep -n -A3 "breakout\|Breakout" server.log >> problems.txt; ok=0; }
          grep -q "started her Encore" server.log || { echo "Voltage encore never triggered" >> problems.txt; ok=0; }
          grep -q "Summoned new Room Ghost\|Summoned new Librarian Specter" server.log || { echo "Room ghost summon failed" >> problems.txt; grep -n "room_ghost" server.log >> problems.txt; ok=0; }
          grep -q "opened Pandora's Box" server.log || { echo "Crate King stage two never triggered" >> problems.txt; ok=0; }
          grep -q "Summoned new Ghost Jailer" server.log || { echo "Summon test did not pass" >> problems.txt; grep -n -B1 -A2 "summon" server.log >> problems.txt; ok=0; }
          grep -q "Boss test: OK" server.log || { echo "Boss moves test failed" >> problems.txt; grep -n -A5 "testbosses\|Boss test" server.log >> problems.txt; ok=0; }
          grep -q "Boss cleanup: OK" server.log || { echo "Boss cage cleanup failed" >> problems.txt; grep -n "Boss cleanup" server.log >> problems.txt; ok=0; }
          grep -q "Net test: OK" server.log || { echo "Net test failed" >> problems.txt; grep -n -A3 "testnet\|Net test" server.log >> problems.txt; ok=0; }
          grep -q "Thermos test: OK" server.log || { echo "Thermos test failed" >> problems.txt; grep -n -A3 "testthermos\|Thermos test" server.log >> problems.txt; ok=0; }
          grep -q "Palace test: OK" server.log || { echo "Palace test failed" >> problems.txt; grep -n -A3 "testpalace\|Palace test" server.log >> problems.txt; ok=0; }
          grep -q "Frost test: OK" server.log || { echo "Frost test failed" >> problems.txt; grep -n -A3 "testfrost\|Frost test" server.log >> problems.txt; ok=0; }
          grep -q "Host test: OK" server.log || { echo "Host test failed" >> problems.txt; grep -n -A3 "testhost\|Host test" server.log >> problems.txt; ok=0; }
          grep -q "Wish Storm" server.log || { echo "Wishkeeper stage two never triggered" >> problems.txt; ok=0; }
          grep -q "Lockdown" server.log || { echo "Jailer lockdown never triggered" >> problems.txt; ok=0; }
          grep -q "Room test: OK" server.log || { echo "Room test did not pass" >> problems.txt; grep -n -A3 "Room test\|testrooms" server.log >> problems.txt; ok=0; }
          if [ $ok != 1 ] || grep -qE "ERROR|Exception" problems.txt; then
            [ -s problems.txt ] || tail -80 server.log > problems.txt
            split -l 25 problems.txt sp_
            for f in sp_*; do
              msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Server test ($f)::$msg"
            done
            exit 1
          fi
          detail=$(grep -iE "Done \(|Portal test|Room test|Prison test|Crate test|Stage test|Boss test|Boss cleanup|Palace test|Frost test|Host test|Wish Storm|Breakout|Encore|Pandora|Summoned|forceload|Marked|Unknown|Incorrect|Loading [0-9]+ mods|phantom" server.log | head -20 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Server test passed::$detail"

      - name: Test the game client starts
        shell: bash
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon > client.log 2>&1 &
          ok=0
          for i in $(seq 1 100); do
            if grep -q "blocks.png-atlas" client.log; then ok=1; break; fi
            if grep -qE "Minecraft Crash Report|MixinApplyError|InvalidInjectionException|MixinTransformerError" client.log; then break; fi
            sleep 5
          done
          sleep 25
          pkill -f java || true
          grep -nE "Crash|Mixin.*(error|fail)|InvalidInjection|Exception.*phantom|phantom.*(ERROR|Exception)|at com\.phantompowers|Caused by" client.log | grep -viE "flite|narrator|text2speech" | head -100 > cproblems.txt || true
          if [ $ok != 1 ] || [ -s cproblems.txt ]; then
            [ -s cproblems.txt ] || tail -60 client.log > cproblems.txt
            split -l 25 cproblems.txt cp_
            for f in cp_*; do
              msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Client test ($f)::$msg"
            done
            exit 1
          fi
          detail=$(grep -E "Loading [0-9]+ mods|phantom|blocks.png-atlas|OpenGL|Backend library" client.log | head -12 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Client test passed::$detail"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: phantom-powers-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish to Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Phantom Powers (build ${{ github.run_number }})
          body: Download phantom-powers-1.0.0.jar below and put it in your .minecraft/mods folder (Minecraft 1.21.1 + Fabric Loader + Fabric API).
          files: |
            build/libs/phantom-powers-1.0.0.jar

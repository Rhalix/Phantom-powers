name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the .jar
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: phantom-powers-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish to Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Phantom Powers (build ${{ github.run_number }})
          body: Download phantom-powers-1.0.0.jar below and put it in your .minecraft/mods folder (Minecraft 1.21.1 + Fabric Loader + Fabric API).
          files: |
            build/libs/phantom-powers-1.0.0.jar

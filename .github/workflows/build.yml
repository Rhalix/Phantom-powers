name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the .jar
        shell: bash
        run: |
          set -o pipefail
          if gradle build --no-daemon 2>&1 | tee build.log; then exit 0; fi
          # Report the important error lines as annotations (readable through the API)
          grep -nE "error:|What went wrong|Exception|Could not|> |warning: \[|Caused by|^\S+\.java:[0-9]+" build.log \
            | grep -vE "^\s*$" | head -150 > errors.txt || true
          [ -s errors.txt ] || tail -80 build.log > errors.txt
          split -l 25 errors.txt part_
          for f in part_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors ($f)::$msg"
          done
          exit 1

      - name: Test the mod in a real server
        shell: bash
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nspawn-protection=0\n" > run/server.properties
          mkfifo cmds
          (sleep 100000 > cmds &)
          gradle runServer --no-daemon < cmds > server.log 2>&1 &
          exec 3> cmds
          ok=0
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log; then ok=1; break; fi
            if ! pgrep -f runServer > /dev/null && ! pgrep java > /dev/null; then break; fi
            sleep 5
          done
          if [ $ok = 1 ]; then
            echo "phantom testportal" >&3
            sleep 3
            echo "execute in phantom:ghost_zone run forceload add 0 0 64 64" >&3
            sleep 40
            echo "stop" >&3
            sleep 20
          fi
          pkill -f java || true
          grep -nE "ERROR|Exception|Caused by|at com\.phantompowers|Mixin|mixin|phantom" server.log \
            | grep -vE "^\s*$" | head -120 > problems.txt || true
          grep -q "Portal test: OK" server.log || { echo "Portal test did not pass" >> problems.txt; grep -n "Portal test" server.log >> problems.txt; ok=0; }
          if [ $ok != 1 ] || grep -qE "ERROR|Exception" problems.txt; then
            [ -s problems.txt ] || tail -80 server.log > problems.txt
            split -l 25 problems.txt sp_
            for f in sp_*; do
              msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Server test ($f)::$msg"
            done
            exit 1
          fi
          detail=$(grep -iE "Done \(|Portal test|forceload|Marked|Unknown|Incorrect|Loading [0-9]+ mods|phantom" server.log | head -20 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Server test passed::$detail"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: phantom-powers-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish to Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Phantom Powers (build ${{ github.run_number }})
          body: Download phantom-powers-1.0.0.jar below and put it in your .minecraft/mods folder (Minecraft 1.21.1 + Fabric Loader + Fabric API).
          files: |
            build/libs/phantom-powers-1.0.0.jar
